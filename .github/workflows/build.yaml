name: Build Record Door Events

on:
  workflow_dispatch:

  release:
    types:
      - published

env:
  IMAGE_NAME: ghcr.io/ujimych/record-door-events

permissions:
  contents: read

jobs:

  build:
    name: Build and publish
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' record_door_events/config.yaml)"

          if [ -z "$VERSION" ]; then
            echo "ERROR: Unable to read version from config.yaml"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Application version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./record_door_events
          file: ./record_door_events/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest

          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
